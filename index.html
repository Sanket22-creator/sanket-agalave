<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanket Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Sanket AI Portfolio Assistant Widget -->
    <style>
      #sa-chat-toggle {
        position: fixed; bottom: 24px; right: 24px; z-index: 999;
        background: #0f172a; color: #ffffff; border: 1px solid #334155;
        border-radius: 999px; padding: 12px 20px; font-family: inherit;
        font-size: 14px; font-weight: 600; cursor: pointer;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        display: flex; align-items: center; gap: 8px; transition: transform 0.2s, background 0.2s;
      }
      #sa-chat-toggle:hover { background: #1e293b; transform: translateY(-2px); }
      #sa-chat-box {
        display: none; position: fixed; bottom: 82px; right: 24px; z-index: 9;
        width: 380px; max-width: calc(100vw - 32px); height: 520px; max-height: 76vh;
        background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22); flex-direction: column; overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #sa-chat-header {
        background: #0f172a; color: #ffffff; padding: 14px 16px;
        display: flex; justify-content: space-between; align-items: center; font-size: 14px;
      }
      #sa-chat-messages {
        flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
        background: #f8fafc; font-size: 13.5px; line-height: 1.5;
      }
      .sa-msg { padding: 10px 14px; border-radius: 12px; max-width: 88%; word-wrap: break-word; }
      .sa-bot { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; align-self: flex-start; }
      .sa-bot strong { font-weight: 700; color: #0f172a; }
      .sa-user { background: #0f172a; color: #ffffff; align-self: flex-end; }
      #sa-chips {
        display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px;
        background: #f8fafc; border-top: 1px solid #e2e8f0;
      }
      .sa-chip {
        font-size: 11.5px; background: #e2e8f0; color: #1e293b; border: none;
        border-radius: 999px; padding: 5px 10px; cursor: pointer; font-weight: 500;
      }
      .sa-chip:hover { background: #cbd5e1; }
      #sa-chat-form { display: flex; border-top: 1px solid #e2e8f0; background: #ffffff; padding: 8px; gap: 6px; }
      #sa-chat-input {
        flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 10px;
        font-size: 13.5px; outline: none; color: #0f172a;
      }
      #sa-chat-input:focus { border-color: #0f172a; }
      #sa-chat-send {
        background: #0f172a; color: #ffffff; border: none; border-radius: 8px;
        padding: 0 14px; font-weight: 600; cursor: pointer;
      }
      #sa-chat-send:hover { background: #1e293b; }
    </style>

    <button id="sa-chat-toggle" aria-label="Open Sanket AI Assistant">💬 Ask Sanket's AI</button>

    <div id="sa-chat-box">
      <div id="sa-chat-header">
        <div>
          <strong>Sanket's Career Assistant</strong><br>
          <span style="font-size:11px;color:#94a3b8;">● Online 24/7 • Trained on all CVs &amp; Thesis</span>
        </div>
        <button id="sa-chat-close" aria-label="Close chat" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div id="sa-chat-messages">
        <div class="sa-msg sa-bot">Hi! I'm Sanket's virtual assistant. Ask me about his supply chain analytics stack, SAP MM procurement work at Rolls-Royce, MRO engineering at Infosys, or his M.Sc. thesis.</div>
      </div>
      <div id="sa-chips">
        <button class="sa-chip" data-q="Summarize Sanket's SAP MM and procurement experience at Rolls-Royce Deutschland.">Rolls-Royce &amp; SAP MM</button>
        <button class="sa-chip" data-q="What tools does Sanket use for supply chain analytics?">Analytics Stack</button>
        <button class="sa-chip" data-q="Tell me about Sanket's M.Sc. thesis on maritime energy chokepoints.">M.Sc. Thesis</button>
      </div>
      <form id="sa-chat-form">
        <input id="sa-chat-input" type="text" placeholder="Ask about experience, skills, projects..." required />
        <button id="sa-chat-send" type="submit">Send</button>
      </form>
    </div>

    <script>
      const WORKER_URL =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "/api/chat"
          : "https://sanket-portfolio-bot.sanketagalave23.workers.dev";
      const chatBox = document.getElementById("sa-chat-box");
      const msgContainer = document.getElementById("sa-chat-messages");
      const input = document.getElementById("sa-chat-input");
      const sendButton = document.getElementById("sa-chat-send");
      const chipButtons = document.querySelectorAll(".sa-chip");
      let history = [];
      let isSending = false;
      const sendQueue = [];

      document.getElementById("sa-chat-toggle").onclick = () => {
        chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
      };
      document.getElementById("sa-chat-close").onclick = () => (chatBox.style.display = "none");

      function formatMarkdown(text) {
        return text
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/^### (.*$)/gim, "<div style='font-weight:700;margin-top:8px;margin-bottom:4px;'>$1</div>")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/^\* (.*$)/gim, "• $1")
          .replace(/\n/g, "<br>");
      }

      function appendMsg(text, sender) {
        const div = document.createElement("div");
        div.className = `sa-msg ${sender === "user" ? "sa-user" : "sa-bot"}`;
        if (sender === "bot") {
          div.innerHTML = formatMarkdown(text);
        } else {
          div.textContent = text;
        }
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;
        return div;
      }

      function setSending(sending) {
        isSending = sending;
        input.disabled = sending;
        sendButton.disabled = sending;
        chipButtons.forEach((button) => {
          button.disabled = sending;
        });
      }

      async function processSendQueue() {
        if (isSending || sendQueue.length === 0) return;

        setSending(true);
        const queued = sendQueue.shift();
        const loading = queued.loading;

        try {
          history.push({ role: "user", parts: [{ text: queued.text }] });
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });
          const data = await res.json();
          const reply = data.reply || "I couldn't process that right now—please feel free to reach out to Sanket via LinkedIn or email!";
          loading.innerHTML = formatMarkdown(reply);
          history.push({ role: "model", parts: [{ text: reply }] });
        } catch {
          loading.textContent = "Network error. Please try again in a moment.";
          history.pop();
        } finally {
          setSending(false);
          processSendQueue();
        }
      }

      function sendQuestion(text) {
        appendMsg(text, "user");
        const loading = appendMsg("Analyzing Sanket's profile...", "bot");
        sendQueue.push({ text, loading });
        processSendQueue();
      }

      document.getElementById("sa-chat-form").onsubmit = (e) => {
        e.preventDefault();
        if (isSending) return;
        const q = input.value.trim();
        if (!q) return;
        input.value = "";
        sendQuestion(q);
      };

      document.querySelectorAll(".sa-chip").forEach((btn) => {
        btn.onclick = () => sendQuestion(btn.dataset.q);
      });
    </script>
  </body>
</html>
